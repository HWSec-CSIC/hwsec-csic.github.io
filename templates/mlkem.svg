  <title id="mlkem-title">Conceptual protected ML-KEM datapath</title><desc id="mlkem-desc">Input and control connect to masked arithmetic and a Keccak module. Parallel shares illustrate higher-order masking. This is a simplified explanatory diagram, not the implemented circuit layout.</desc>
