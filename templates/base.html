<!doctype html>
<!-- Generated by scripts/build.py. Edit templates/ or assets/docs/, then rebuild. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071522">
  <title>$title</title>
  <meta name="description" content="$description">
  $extra_meta
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$site_url/assets/images/grupo.jpeg">
  <link rel="icon" href="assets/images/mark.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="preload" href="assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body class="$page_class">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="$site_name home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="16" height="16" rx="1"/><rect x="12" y="12" width="8" height="8"/><path d="M12 3v5m8-5v5M12 24v5m8-5v5M3 12h5m-5 8h5m16-8h5m-5 8h5"/></g></svg><span>$site_name</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="primary-nav" aria-expanded="false" hidden>
        <span class="menu-label">Menu</span><span class="burger" aria-hidden="true"><span></span><span></span></span>
      </button>
      <nav id="primary-nav" class="site-nav" aria-label="Main navigation">$navigation</nav>
    </div>
  </header>
  <main id="main">$content</main>
  <footer class="site-footer">
    <div class="container footer-main">
      <div class="footer-about">
        <a class="brand" href="index.html"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="16" height="16" rx="1"/><rect x="12" y="12" width="8" height="8"/><path d="M12 3v5m8-5v5M12 24v5m8-5v5M3 12h5m-5 8h5m16-8h5m-5 8h5"/></g></svg><span>$site_name</span></a>
        <p>$group_name</p>
      </div>
      <div class="footer-address">
        <h2 class="footer-label">Institute</h2>
        <address>$institution<br>$address<br>$city</address>
        <a class="footer-phone" href="tel:$phone_raw">$phone</a>
      </div>
      <div>
        <h2 class="footer-label">Part of</h2>
        <div class="footer-links">$institution_links</div>
      </div>
      <div>
        <h2 class="footer-label">Online</h2>
        <div class="footer-links social-links">$social_links</div>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>© <span data-current-year>$copyright_year</span> $site_name</span>
      <a href="https://www.imse-cnm.csic.es/" target="_blank" rel="noopener noreferrer"><img src="assets/images/marca_imse_blanco.png" width="1064" height="354" alt="Instituto de Microelectrónica de Sevilla" loading="lazy"></a>
      <span>$institutionShort</span>
    </div>
  </footer>
  <div id="site-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  $extra_scripts
</body>
</html>
